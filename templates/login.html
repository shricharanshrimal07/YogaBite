
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YogaBite | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f8f3e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.container {
    display: flex;
    width: 950px;
    max-width: 100%;
    min-height: 550px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

.left {
    width: 50%;
    background:
        linear-gradient(rgba(25,65,42,0.2), rgba(25,65,42,0.45)),
        url("/static/images/new-dry-fruits.jpg") center/cover no-repeat;
}

.right {
    width: 50%;
    padding: 55px 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.logo {
    color: #285c3c;
    font-size: 35px;
    font-weight: bold;
    text-align: center;
}

.tagline {
    text-align: center;
    color: #b98738;
    margin: 8px 0 35px;
    font-size: 13px;
}

h2 {
    color: #285c3c;
    margin-bottom: 10px;
}

.subtitle {
    color: #888;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin: 10px 0;
    outline-color: #285c3c;
    font-size: 14px;
}

button {
    width: 100%;
    background: #285c3c;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #407b50;
}

.bottom {
    text-align: center;
    margin-top: 25px;
    color: #777;
}

a {
    color: #285c3c;
    font-weight: bold;
    text-decoration: none;
}

.message {
    color: #c0392b;
    font-size: 14px;
    margin-bottom: 10px;
}

@media(max-width: 700px) {
    .left {
        display: none;
    }

    .right {
        width: 100%;
        padding: 40px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="left"></div>

    <div class="right">

        <div class="logo">YogaBite</div>

        <div class="tagline">
            Small Bite, Big Nutrition
        </div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to enjoy healthy and nutritious laddus.
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">

            <!-- CSRF Security Token -->
            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <div class="bottom">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Sign Up</a>
        </div>

    </div>

</div>

</body>
</html>
